<!doctype html>
<html lang="es-AR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
  <title>SPLG</title>
  <script>
    // Pone la clase `dark` antes de pintar nada: sin esto, la página carga
    // clara un instante y después salta a oscura (ThemeModeProvider en React.js
    // hace lo mismo en cada cambio; acá sólo se adelanta al primer render).
    (function () {
      try {
        var stored = localStorage.getItem('themeMode');
        var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        // Sin localStorage, se queda en claro: no hay parpadeo igual, sólo sin recordar la preferencia.
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
