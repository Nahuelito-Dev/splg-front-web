name: Deploy panel

# Publica el panel en Firebase Hosting (https://splg-gas.web.app) cuando el Release automático
# de main termina bien, o a mano desde Actions > Deploy panel > Run workflow.
#
# Secretos: FIREBASE_SERVICE_ACCOUNT_SPLG_GAS, VITE_GOOGLE_MAPS_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID. Variable: API_PUBLICA (https://orix-server…ts.net, sin /api).
on:
  workflow_run:
    workflows: ['Release automatico']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o commit a publicar'
        default: main

concurrency:
  group: deploy-panel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Sólo lo que ya está en main
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "«$REF» no está en main: a producción sólo va lo que ya se integró a main."; exit 1
          fi

      - name: Script de avisos
        run: |
          # Lo que se despliega puede ser anterior al script: se toma de develop si falta.
          if [ ! -f .github/scripts/telegram.sh ]; then
            git fetch -q origin develop
            mkdir -p .github/scripts
            git show origin/develop:.github/scripts/telegram.sh > .github/scripts/telegram.sh
          fi
          chmod +x .github/scripts/telegram.sh

      - name: Datos del deploy
        id: c
        env:
          DISPARO: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "corto=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          . .github/scripts/telegram.sh --funciones
          anterior=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          rango=${anterior:+$anterior..}HEAD
          total=$(git log --no-merges --format=%s "$rango" | grep -vc '^chore(release)' || true)
          {
            echo "cambios<<FIN"
            git log --no-merges --format='• %s' "$rango" | grep -v '^• chore(release)' | head -n 10 | cut -c1-90 | escapar
            [ "$total" -gt 10 ] && echo "… y $((total - 10)) más"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"
          if [ "$DISPARO" = workflow_dispatch ]; then echo "como=lanzado a mano por $ACTOR" >> "$GITHUB_OUTPUT"
          else echo "como=después del release de main" >> "$GITHUB_OUTPUT"; fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "desde=${anterior:-el inicio}" >> "$GITHUB_OUTPUT"

      - name: Aviso de inicio
        env:
          CAMBIOS: ${{ steps.c.outputs.cambios }}
          COMO: ${{ steps.c.outputs.como }}
          TOTAL: ${{ steps.c.outputs.total }}
          DESDE: ${{ steps.c.outputs.desde }}
          VERSION: ${{ steps.c.outputs.version }}
          CORTO: ${{ steps.c.outputs.corto }}
        run: |
          {
            printf '🚀 <b>Deploy %s</b> · producción\n' "panel"
            printf 'v%s · <code>%s</code> · %s\n' "$VERSION" "$CORTO" "$COMO"
            if [ "$TOTAL" -gt 0 ]; then printf '\n<b>%s cambio(s) desde %s:</b>\n%s\n' "$TOTAL" "$DESDE" "$CAMBIOS"; fi
          } | .github/scripts/telegram.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reglas (el mismo gate que Checks)
        id: reglas
        env:
          TZ: UTC
        run: npm run verify

      - name: Compilar
        id: compilar
        env:
          VITE_APP_API_URL: ${{ vars.API_PUBLICA }}/api
          VITE_APP_SOCKET_URL: ${{ vars.API_PUBLICA }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npx vite build

      - name: Publicar en Firebase Hosting
        id: publicar
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPLG_GAS }}
          projectId: splg-gas
          channelId: live

      - name: El panel responde
        id: responde
        run: |
          c=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://splg-gas.web.app/login)
          [ "$c" = 200 ] || { echo "El panel publicado respondió $c"; exit 1; }

      - name: Aviso de resultado
        if: always()
        env:
          ESTADO: ${{ job.status }}
          INICIO: ${{ steps.c.outputs.inicio }}
          VERSION: ${{ steps.c.outputs.version }}
          CORTO: ${{ steps.c.outputs.corto }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          P_0: ${{ steps.reglas.outcome }}
          P_1: ${{ steps.compilar.outcome }}
          P_2: ${{ steps.publicar.outcome }}
          P_3: ${{ steps.responde.outcome }}
        run: |
          min=$(( ( $(date +%s) - ${INICIO:-$(date +%s)} + 59 ) / 60 ))
          nombres=("Reglas (gate)" "Compilar" "Publicar en Firebase" "Panel publicado")
          resultados=("$P_0" "$P_1" "$P_2" "$P_3")
          fallo=""
          for i in "${!nombres[@]}"; do [ "${resultados[$i]}" = failure ] && { fallo="${nombres[$i]}"; break; }; done
          {
            if [ "$ESTADO" = success ]; then
              printf '✅ <b>Panel v%s en producción</b> · %s min\n<code>%s</code> · https://splg-gas.web.app\n' "$VERSION" "$min" "$CORTO"
            elif [ "$ESTADO" = cancelled ]; then
              printf '⚪ <b>Deploy Panel v%s cancelado</b> · %s min\nProducción sigue con la versión anterior.\n<a href="%s">Ver detalle</a>\n' "$VERSION" "$min" "$RUN_URL"
            else
              printf '🔴 <b>Deploy Panel v%s falló</b>%s · %s min\nProducción sigue con la versión anterior.\n<a href="%s">Ver detalle</a>\n' "$VERSION" "${fallo:+ en «$fallo»}" "$min" "$RUN_URL"
            fi
          } | .github/scripts/telegram.sh
