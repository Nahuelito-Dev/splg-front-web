name: CI + Deploy → Netlify (Yennigas Panel)

on:
  push:
    branches: [ "main" ] # O 'master', confirma tu rama principal

jobs:
  trigger_netlify_build:
    runs-on: ubuntu-latest
    # `secrets` no se puede leer en un `if:` (GitHub rechaza el archivo): se pasa por env.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Obtener datos del Commit
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "date=$(date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: 🔔 Slack Notificación (INICIO)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }} # Solo si existe el secreto
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚧 *Deploy iniciado* en Netlify (Yennigas)\n👤 Autor: ${{ steps.vars.outputs.author }}\n🔢 Commit: ${{ steps.vars.outputs.sha_short }}\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: 🚀 Disparar Build en Netlify
        run: |
          curl -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"

      - name: ✅ Slack Notificación (EXITO)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚀 *Deploy enviado a Netlify* (Yennigas)\n👤 Autor: ${{ steps.vars.outputs.author }}\n🔢 Commit: ${{ steps.vars.outputs.sha_short }}\n📅 Hora: ${{ steps.vars.outputs.date }}\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"