name: Deploy panel

# Publica el panel en Firebase Hosting (https://splg-gas.web.app) cuando el Release automático
# de main termina bien, o a mano desde Actions > Deploy panel > Run workflow.
#
# Secretos: FIREBASE_SERVICE_ACCOUNT_SPLG_GAS, VITE_GOOGLE_MAPS_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID. Variable: API_PUBLICA (https://orix-server…ts.net, sin /api).
on:
  workflow_run:
    workflows: ['Release automatico']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o commit a publicar'
        default: main

concurrency:
  group: deploy-panel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Datos del commit
        id: c
        run: |
          echo "corto=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Aviso de inicio
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚀 Deploy panel iniciado · v${{ steps.c.outputs.version }} (${{ steps.c.outputs.corto }}) por ${{ github.actor }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Compilar
        env:
          VITE_APP_API_URL: ${{ vars.API_PUBLICA }}/api
          VITE_APP_SOCKET_URL: ${{ vars.API_PUBLICA }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npx vite build

      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPLG_GAS }}
          projectId: splg-gas
          channelId: live

      - name: El panel responde
        run: |
          c=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://splg-gas.web.app/login)
          [ "$c" = 200 ] || { echo "El panel publicado respondió $c"; exit 1; }

      - name: Aviso de resultado
        if: always()
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          if [ "${{ job.status }}" = success ]; then t="✅ Deploy panel ok · v${{ steps.c.outputs.version }} (${{ steps.c.outputs.corto }}) en https://splg-gas.web.app"
          else t="🔴 Deploy panel falló · v${{ steps.c.outputs.version }} (${{ steps.c.outputs.corto }}). Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$t" -d disable_web_page_preview=true
