name: Claude review

# Revisión automática de cada PR con Claude y respuesta a menciones @claude.
# Autenticación: secreto CLAUDE_CODE_OAUTH_TOKEN (claude setup-token). Además requiere la
# GitHub App de Claude instalada en el repo (/install-github-app) para escribir comentarios.
# Docs: https://github.com/anthropics/claude-code-action (README, docs/usage.md, docs/solutions.md)
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [develop, main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Sos el revisor de código de splg-app-admin: Panel web de SPLG (React + Vite + TypeScript + React Query 5 + MUI/Tailwind + zod). Convenciones: splg-docs/sistema/panel/CONVENCIONES.md.
            Revisá este pull request y respondé en castellano rioplatense, directo y concreto.

            Antes de opinar, leé AGENTS.md y CLAUDE.md de la raíz del repo (y las convenciones que citan).
            La rama del PR ya está en el directorio de trabajo; usá `gh pr diff` para ver el cambio.

            Buscá, en este orden:
            1. Bugs y casos borde que rompen el comportamiento.
            2. Seguridad: secretos, inyección, autorización, datos expuestos.
            2b. Reglas propias de este repo (las marcadas BLOQUEANTE son bloqueantes):
              - Datos sólo por services/api (una función tipada por endpoint) + hooks de services/queries con queryKeys. Nada de fetch/axios sueltos en componentes.
              - Tipos de la API generados (npm run api:types), nunca escritos a mano.
              - Cálculos de plata (precio, promo, recargo, total) NO se hacen en el panel: se muestra lo que da la API. Es BLOQUEANTE si el panel recalcula o decide importes.
              - Colores sólo de src/theme/brand.json (sistema Brasa); npm run colors lo controla.
              - Un endpoint del back que el panel no usa, o una pantalla que llama algo que el back no tiene, no cuenta como entregado.
              - Validaciones con zod en el formulario (además del back); textos de interfaz en castellano, código en inglés.
              - Aislamiento por distribuidora: el panel nunca arma ni acepta el tenant desde un dato del usuario sin pasar por el contexto de sesión.
              - Fechas de negocio en hora argentina sin depender del TZ del navegador/proceso.
            3. Tests que no fallarían sin el cambio (un test nuevo tiene que fallar sin el arreglo).
            4. Lo que contradice AGENTS.md o las convenciones del repo.

            Clasificá cada hallazgo. Empezá el comentario con `BLOQUEANTE:` si impide el merge
            (bug real, fuga entre distribuidoras, plata calculada fuera del back, migración sin auditoría,
            test que no prueba nada) o `SUGERENCIA:` si es opcional. Si no hay bloqueantes, decilo explícitamente.
            No repitas lo que el lint o el CI ya controlan. No inventes: si no estás seguro, preguntá.

            Dejá el resumen con `gh pr comment` y los hallazgos puntuales como comentarios en línea con
            `mcp__github_inline_comment__create_inline_comment` (con `confirmed: true`). No modifiques archivos.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mencion:
    # Respuesta a @claude en comentarios; sólo de gente con permisos de escritura en el repo.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --append-system-prompt "Respondé siempre en castellano rioplatense. Leé AGENTS.md y CLAUDE.md del repo antes de contestar y respetá sus reglas. No commitees ni pushees."
